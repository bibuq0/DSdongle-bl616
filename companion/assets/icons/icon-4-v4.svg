<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6fd6"/>
      <stop offset="1" stop-color="#08203f"/>
    </linearGradient>
    <linearGradient id="ringFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe8ff"/>
    </linearGradient>
    <linearGradient id="ringBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66b3ff"/>
      <stop offset="1" stop-color="#1c66b8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- ring B (blue) full: bottom layer -->
  <circle cx="274" cy="268" r="116" fill="none" stroke="url(#ringBack)" stroke-width="34"/>

  <!-- ring A (white) full: middle layer -->
  <circle cx="238" cy="244" r="116" fill="none" stroke="url(#ringFront)" stroke-width="36"/>

  <!-- ring B top arc redrawn on top: weaves over ring A -->
  <path d="M158 268 a116 116 0 0 1 232 0"
        fill="none" stroke="url(#ringBack)" stroke-width="34" stroke-linecap="round"/>

  <!-- wifi signal at center (inside both rings, no overlap) -->
  <path d="M228 222 a28 28 0 0 1 56 0" fill="none" stroke="#0d3a74" stroke-width="14" stroke-linecap="round"/>
  <path d="M228 222 a28 28 0 0 1 56 0" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <path d="M238 238 a18 18 0 0 1 36 0" fill="none" stroke="#0d3a74" stroke-width="14" stroke-linecap="round"/>
  <path d="M238 238 a18 18 0 0 1 36 0" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="252" r="9" fill="#0d3a74"/>
  <circle cx="256" cy="252" r="6" fill="#ffffff"/>
</svg>
