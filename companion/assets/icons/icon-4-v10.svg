<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6fd6"/>
      <stop offset="1" stop-color="#08203f"/>
    </linearGradient>
    <linearGradient id="ringFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe8ff"/>
    </linearGradient>
    <linearGradient id="ringBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66b3ff"/>
      <stop offset="1" stop-color="#1c66b8"/>
    </linearGradient>
    <clipPath id="topHalf">
      <rect x="60" y="120" width="400" height="150"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- white rounded square, full: bottom layer -->
  <rect x="92" y="138" width="236" height="236" rx="52"
        fill="none" stroke="url(#ringFront)" stroke-width="36"/>

  <!-- blue ring, full: middle layer, covers square's right side -->
  <circle cx="302" cy="256" r="116" fill="none" stroke="url(#ringBack)" stroke-width="34"/>

  <!-- redraw white square top half on top: weaves over blue ring -->
  <g clip-path="url(#topHalf)">
    <rect x="92" y="138" width="236" height="236" rx="52"
          fill="none" stroke="url(#ringFront)" stroke-width="36"/>
  </g>
</svg>
