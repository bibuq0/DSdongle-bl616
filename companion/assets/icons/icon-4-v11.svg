<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe9ff"/>
      <stop offset="1" stop-color="#9ccbf5"/>
    </linearGradient>
    <linearGradient id="ringFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
    <linearGradient id="ringBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6bd6"/>
      <stop offset="1" stop-color="#0e57b8"/>
    </linearGradient>
    <clipPath id="topHalf">
      <rect x="60" y="130" width="400" height="140"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- white rounded square, full: bottom layer -->
  <rect x="89" y="151" width="210" height="210" rx="48"
        fill="none" stroke="url(#ringFront)" stroke-width="36"/>

  <!-- blue ring, full: middle layer -->
  <circle cx="320" cy="256" r="102" fill="none" stroke="url(#ringBack)" stroke-width="34"/>

  <!-- redraw white square top half on top: weaves over blue ring -->
  <g clip-path="url(#topHalf)">
    <rect x="89" y="151" width="210" height="210" rx="48"
          fill="none" stroke="url(#ringFront)" stroke-width="36"/>
  </g>
</svg>
