<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9dff"/>
      <stop offset="1" stop-color="#0a2b52"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- interlocking rings (wireless / link) -->
  <circle cx="256" cy="210" r="118" fill="none" stroke="#ffffff" stroke-width="34"/>
  <circle cx="256" cy="302" r="118" fill="none" stroke="#3d9bff" stroke-width="34" opacity="0.85"/>
  <!-- center dot -->
  <circle cx="256" cy="256" r="40" fill="#ffffff"/>
  <circle cx="256" cy="256" r="40" fill="none" stroke="#0a2b52" stroke-width="6" opacity="0.2"/>
  <!-- small controller grip accents -->
