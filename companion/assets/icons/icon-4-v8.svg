<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6fd6"/>
      <stop offset="1" stop-color="#08203f"/>
    </linearGradient>
    <linearGradient id="ringFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe8ff"/>
    </linearGradient>
    <linearGradient id="ringBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66b3ff"/>
      <stop offset="1" stop-color="#1c66b8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- left ring A (white), full: bottom layer -->
  <circle cx="210" cy="256" r="118" fill="none" stroke="url(#ringFront)" stroke-width="36"/>
  <!-- right ring B (blue), full: middle layer -->
  <circle cx="302" cy="256" r="118" fill="none" stroke="url(#ringBack)" stroke-width="34"/>
  <!-- redraw A's top arc on top: weaves over B -->
  <path d="M92 256 a118 118 0 0 1 236 0"
        fill="none" stroke="url(#ringFront)" stroke-width="36" stroke-linecap="round"/>

  <!-- flat apple-style wifi signal (two shallow arcs + dot) -->
  <path d="M206 244 a110 110 0 0 1 100 0"
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <path d="M193 226 a132 132 0 0 1 126 0"
        fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="258" r="8" fill="#ffffff"/>
</svg>
